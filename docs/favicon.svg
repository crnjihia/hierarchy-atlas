<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b1120" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Tree connecting lines -->
  <path d="M32 14 L18 30 M32 14 L46 30 M18 30 L12 48 M18 30 L24 48 M46 30 L40 48 M46 30 L52 48" 
        stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  
  <!-- Tree Nodes -->
  <!-- Root -->
  <circle cx="32" cy="14" r="6" fill="#10b981" filter="url(#glow)" />
  <circle cx="32" cy="14" r="2.5" fill="#ffffff" />
  
  <!-- Level 1 -->
  <circle cx="18" cy="30" r="4.5" fill="#06b6d4" />
  <circle cx="46" cy="30" r="4.5" fill="#06b6d4" />
  
  <!-- Level 2 Leaves -->
  <circle cx="12" cy="48" r="3.5" fill="#818cf8" />
  <circle cx="24" cy="48" r="3.5" fill="#818cf8" />
  <circle cx="40" cy="48" r="3.5" fill="#818cf8" />
  <circle cx="52" cy="48" r="3.5" fill="#818cf8" />
</svg>
