services:
  db:
    image: postgres:16-alpine
    container_name: hierarchy_atlas_db
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: hierarchy_atlas
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./benchmarks:/benchmarks:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U dev -d hierarchy_atlas -c 'SELECT 1 FROM regions WHERE path IS NOT NULL LIMIT 1;' > /dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  db_data:
